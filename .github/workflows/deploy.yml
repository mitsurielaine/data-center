name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: data-center-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Verificar sintaxis del backend
        working-directory: backend
        run: npm run check

      - name: Validar sintaxis de docker-compose
        run: docker compose config --quiet

      - name: Construir las imágenes (build de extremo a extremo)
        run: docker compose build

  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en el VPS por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/data-center
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            curl --fail --retry 10 --retry-delay 3 http://localhost/api/health
