# FASE 1 — todavía no existe certificado de Let's Encrypt.
# La aplicación se sirve por HTTP y el puerto 80 queda disponible para que
# certbot complete el desafío ACME. El entrypoint activa el sitio TLS
# automáticamente en cuanto el certificado existe.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Desafío HTTP-01 de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Sonda de salud del contenedor (nunca redirige, no ensucia el log)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/app-locations.conf;
}
