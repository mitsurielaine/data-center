# FASE 2 — ya existe certificado válido de Let's Encrypt.
# El puerto 80 solo atiende el desafío ACME y la sonda de salud; todo lo demás
# se redirige a HTTPS con 308 (preserva el método HTTP, a diferencia de un 301,
# que convertiría un POST en GET). La aplicación se sirve solo por TLS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Solo protocolos vigentes: TLS 1.0/1.1 y SSLv3 quedan deshabilitados.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # El HSTS se emite desde el snippet de cabeceras de seguridad (ver el
    # comentario en security-headers.conf sobre la herencia de add_header).
    include /etc/nginx/snippets/app-locations.conf;
}
