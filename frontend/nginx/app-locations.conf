# Rutas de la aplicación. Este snippet se incluye en el server que sirve la
# app: el de HTTP mientras no hay certificado, o el de HTTPS cuando ya existe.

limit_conn conn_limit 20;

# Proxy inverso hacia el backend (red interna de Docker; nunca expuesto directo)
location /api/ {
    # Rate limiting: 10 r/s por IP con ráfaga de 20.
    limit_req zone=api_limit burst=20 nodelay;

    # Cuerpo de petición acotado: la API solo recibe JSON pequeño.
    client_max_body_size 16k;

    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # No cachear respuestas de la API en intermediarios.
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# SPA: cualquier ruta no reconocida devuelve index.html
location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
}
