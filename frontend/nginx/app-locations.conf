# Rutas de la aplicación. Este snippet se incluye en el server que sirve la
# app: el de HTTP mientras no hay certificado, o el de HTTPS cuando ya existe.

limit_conn conn_limit 20;

# Se ajusta a nivel de server para no duplicar la directiva del nginx.conf base.
keepalive_timeout 30s;

# Proxy inverso hacia el backend (red interna de Docker; nunca expuesto directo)
location /api/ {
    # Rate limiting: 10 r/s por IP con ráfaga de 20.
    limit_req zone=api_limit burst=20 nodelay;

    # Cuerpo de petición acotado: la API solo recibe JSON pequeño.
    client_max_body_size 16k;

    # El upstream se resuelve en tiempo de ejecución con el DNS interno de
    # Docker (127.0.0.11) en lugar de fijarse al cargar la configuración.
    # Ventajas: Nginx arranca aunque el backend todavía no exista, sobrevive a
    # un cambio de IP del contenedor, y permite validar la configuración con
    # "nginx -t" durante el build de la imagen (donde el nombre "backend" no
    # resuelve todavía).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream "http://backend:3000";
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    # Nginx es la ÚNICA fuente de las cabeceras de seguridad en el borde.
    # helmet también las emite en el backend (defensa en profundidad, por si la
    # API se expusiera algún día de forma directa), pero al pasar por el proxy
    # ambas se concatenaban: "X-Frame-Options: SAMEORIGIN, DENY". Ante valores
    # contradictorios el navegador puede descartar la cabecera entera, así que
    # se ocultan las del backend y prevalecen las de Nginx.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header Permissions-Policy;

    # No cachear respuestas de la API en intermediarios.
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
}

# El fallback del SPA hacía que /favicon.ico devolviera el index.html con
# Content-Type: text/html y código 200. Se responde 204 para no servir HTML
# donde el navegador espera una imagen.
location = /favicon.ico {
    access_log off;
    log_not_found off;
    return 204;
}

# SPA: cualquier ruta no reconocida devuelve index.html
location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
}
