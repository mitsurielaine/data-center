# Endurecimiento a nivel http (este archivo se carga desde /etc/nginx/conf.d/).
# Corrige: divulgación de versión del servidor y ausencia de límites de petición.

# No revelar "nginx/1.27.x" en las cabeceras ni en las páginas de error.
server_tokens off;

# Zona de limitación de tasa para la API: 10 peticiones/segundo por IP.
# Mitiga fuerza bruta y abuso automatizado del CRUD.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# Límite de conexiones simultáneas por IP (mitiga agotamiento de recursos).
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn_status 429;

# Tiempos de espera acotados: evita que conexiones lentas ocupen workers
# (tipo Slowloris) en una instancia con 1 GiB de RAM.
# Nota: keepalive_timeout NO se define aquí porque el nginx.conf base de la
# imagen oficial ya lo declara en el contexto http y nginx aborta con
# "directive is duplicate"; se ajusta a nivel de server (app-locations.conf).
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 15s;
