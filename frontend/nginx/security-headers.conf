# Cabeceras de seguridad HTTP.
# "always" es importante: sin él, nginx no envía estas cabeceras en las
# respuestas de error (4xx/5xx), que es justo donde más se necesitan.

# Content-Security-Policy: sin 'unsafe-inline' en scripts porque el frontend
# se refactorizó a archivos externos y delegación de eventos. Las fuentes de
# Google se permiten de forma explícita (única dependencia de terceros).
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# HSTS. Va aquí, junto al resto de cabeceras, porque en Nginx un add_header
# declarado dentro de un location REEMPLAZA los heredados del bloque server:
# si el HSTS se declarara solo a nivel de server, desaparecería de todas las
# respuestas servidas por los location. El archivo lo escribe el entrypoint y
# está vacío mientras no exista un certificado de confianza.
include /etc/nginx/snippets/hsts.conf;
