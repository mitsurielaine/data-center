<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Tareas · VPS Data Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="console">
  <div class="eyebrow off" id="apiEyebrow"><span class="dot"></span><span id="apiStatus">conectando con la API…</span></div>
  <h1>Gestor de <span>tareas</span></h1>
  <p class="lede">Panel de administración de tareas — CRUD completo sobre PostgreSQL, servido detrás de Nginx en un VPS de AWS. Proyecto de Administración de Data Center, UPSE. Desplegado automáticamente con GitHub Actions.</p>

  <div class="stats">
    <div class="stat queued"><b id="statQueued">0</b><small>PENDIENTES</small></div>
    <div class="stat done"><b id="statDone">0</b><small>COMPLETADAS</small></div>
    <div class="stat total"><b id="statTotal">0</b><small>TOTAL</small></div>
  </div>

  <div class="panel">
    <form class="cmd-row" id="addForm">
      <input type="text" id="titleInput" placeholder="Nueva tarea…" maxlength="255" autocomplete="off">
      <button type="submit">Agregar</button>
    </form>

    <div class="filter-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="filterInput" placeholder="Filtrar por título…" autocomplete="off">
      <span class="count" id="filterCount"></span>
    </div>

    <div class="list" id="list"></div>
  </div>

  <div class="foot">
    <span>API: <code id="apiPathLabel">/api/tasks</code></span>
    <span id="lastSync">—</span>
  </div>
</div>

<div id="toasts"></div>

<script src="/app.js" defer></script>
</body>
</html>
